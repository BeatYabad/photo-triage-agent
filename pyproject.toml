[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "photo-triage-core"
version = "0.2.0"
description = "Local, read-only photo analysis and resumable batches"
requires-python = ">=3.11"
dependencies = ["Pillow>=10", "numpy>=1.26", "opencv-python-headless>=4.9", "ImageHash>=4.3"]

[tool.setuptools.packages.find]
include = ["photo_triage*"]
